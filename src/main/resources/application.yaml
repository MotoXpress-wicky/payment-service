spring:
  application:
    name: payment-service
  profiles:
    # IntelliJ runs the "dev" profile. The Docker env file sets SPRING_PROFILES_ACTIVE=docker.
    default: dev
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway creates the tables. Hibernate only checks that they match the entities.
      ddl-auto: validate
  rabbitmq:
    template:
      # Sending an event is tried 3 times before it is given up.
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 500ms
    listener:
      simple:
        # A failed message is tried 3 times (2 s, then 4 s apart). After that it goes to the dead-letter queue.
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2
  servlet:
    multipart:
      # A little above payments.receipt-file.max-size-bytes, so our own check gives the clear error.
      max-file-size: 6MB
      max-request-size: 7MB

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    # traceId = the X-Request-Id that Nginx adds to every request
    level: "%5p [${spring.application.name},%X{traceId:-}]"

auth:
  token:
    # Same secret as user-service. TODO: replace with the RS256 public key when user-service signs with RS256 (M17).
    secret: ${JWT_SECRET}
  cookie:
    name: access_token

payments:
  payment-number-prefix: "PAY-"
  couriers:
    - Courier A
    - Courier B
  default-page-size: 20
  max-page-size: 100
  receipt-file:
    max-size-bytes: 5242880
  max-tracking-numbers-per-receipt: 200

# Which events this service listens to, and what each one does to a payment. This is the ONLY place where the
# event names appear: the Java code only knows the generic actions (CREATE, SET_SHIPMENT, COLLECT, CANCEL).
events:
  exchange: app.events
  queue: payment.order-events
  # The outbox (M46): an event is saved in the database with the change it announces, then sent to RabbitMQ.
  # If RabbitMQ is down, it waits there and is sent later.
  outbox:
    enabled: true          # false turns off the background retry and cleanup
    retry-interval: 10s    # how often waiting events are tried again
    batch-size: 50         # events per sending round
    keep: 7d               # sent events are deleted after this time
  listen:
    - { name: order.placed, action: CREATE }
    - { name: order.shipped, action: SET_SHIPMENT }
    - { name: order.delivered, action: COLLECT }
    - { name: order.returned, action: CANCEL }
    - { name: order.cancelled, action: CANCEL }

storage:
  # The S3 API of the object-storage container. AWS S3 later: change only these values.
  s3:
    endpoint: ${S3_ENDPOINT}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    bucket: ${S3_BUCKET:courier-receipts}
